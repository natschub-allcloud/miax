version: 1
# The Next.js app lives in the `frontend/` subfolder of the repo, so this is a
# monorepo build spec. In the Amplify console set the app's root directory to
# `frontend` (App settings → Build settings → App root). The env vars API_URL
# and API_KEY must be set in the Amplify console (App settings → Environment
# variables) — they're read server-side by the Next.js API routes.
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Use npm install (not npm ci) since the lockfile was removed with
            # the Amplify Gen2 scaffolding; this is plain frontend hosting only.
            - npm install

        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
