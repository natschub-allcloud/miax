version: 1
# The Next.js app lives in the `frontend/` subfolder of the repo, so this is a
# monorepo build spec. In the Amplify console set the app's root directory to
# `frontend` (App settings → Build settings → App root). The env vars API_URL
# and API_KEY must be set in the Amplify console (App settings → Environment
# variables) — they're read server-side by the Next.js API routes.
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Use npm install (not npm ci) since the lockfile was removed with
            # the Amplify Gen2 scaffolding; this is plain frontend hosting only.
            - npm install

        build:
          commands:
            # Amplify console env vars are available at BUILD time but are NOT
            # auto-injected into the Next.js SSR runtime. Write them to
            # .env.production so the server-side /api/* route handlers can read
            # process.env.API_URL / API_KEY at request time. (Next only exposes
            # NEXT_PUBLIC_* to the browser, so these stay server-only/secret.)
            - 'echo "API_URL=$API_URL" >> .env.production'
            - 'echo "API_KEY=$API_KEY" >> .env.production'
            - npm run build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
